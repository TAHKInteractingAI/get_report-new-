name: Run Teams GetReport Cronjob

on:
  schedule:
    # 01:00 UTC = 08:00 sáng Việt Nam
    - cron: '0 1 * * *'
    # 07:00 UTC = 14:00 chiều Việt Nam
    - cron: '0 7 * * *'

  # Nút bấm thủ công
  workflow_dispatch:

jobs:
  run-report-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then 
            pip install -r requirements.txt
          else 
            pip install undetected-chromedriver selenium gspread google-auth python-dotenv pytz beautifulsoup4 python-dateutil oauth2client
          fi

      - name: Execute Report Python Script
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          GCP_SA_KEY: ${{ secrets.GCP_CREDENTIALS_JSON }}
          TEAMS_EMAIL: ${{ secrets.TEAMS_EMAIL }}
          TEAMS_PASSWORD: ${{ secrets.TEAMS_PASSWORD }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python get_report.py

      - name: Upload error screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots
          path: '*.png'
          retention-days: 7
